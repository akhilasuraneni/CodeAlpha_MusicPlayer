
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telugu Beats Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
        <h1 class="logo">🎵 Telugu Beats</h1>

        <div class="playlist-title">PLAYLIST</div>

        <ul id="playlist"></ul>
    </div>


    <!-- Main Player -->
    <div class="player-section">

        <div class="top-bar">
            <h2>Music Player</h2>
        </div>


        <div class="music-card">

            <img id="cover" src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=800" alt="cover">

            <h2 id="title">Song Name</h2>
            <h3 id="artist">Artist</h3>

            <audio id="audio"></audio>


            <!-- Progress -->
            <div class="progress-container" id="progress-container">
                <div class="progress" id="progress"></div>
            </div>

            <div class="time">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>


            <!-- Controls -->
            <div class="controls">
                <button id="prev">
                    <i class="fa-solid fa-backward"></i>
                </button>

                <button id="play">
                    <i class="fa-solid fa-play"></i>
                </button>

                <button id="next">
                    <i class="fa-solid fa-forward"></i>
                </button>
            </div>


            <!-- Volume -->
            <div class="volume-box">
                <i class="fa-solid fa-volume-high"></i>
                <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
            </div>


            <!-- AutoPlay -->
            <div class="autoplay-box">
                <label>
                    <input type="checkbox" id="autoplay" checked>
                    Auto Play Next Song
                </label>
            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
